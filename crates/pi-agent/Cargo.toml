[package]
name = "pi-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
pi-ai = { version = "=0.1.0", path = "../pi-ai" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "raw_value"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
uuid = { version = "=1.26.0", default-features = false, features = ["v7"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
