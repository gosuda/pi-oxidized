[package]
name = "pi-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
futures = { version = "=0.3.32", default-features = false, features = ["alloc"] }
pi-ai = { version = "=0.1.0", path = "../pi-ai" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.52.4", default-features = false, features = ["macros", "rt", "sync"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.52.4", default-features = false, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
