[package]
name = "pi-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anstyle-parse = "=1.0.0"
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
futures = { version = "=0.3.32", default-features = false, features = ["alloc"] }
pi-agent = { version = "=0.1.0", path = "../pi-agent" }
pi-ai = { version = "=0.1.0", path = "../pi-ai" }
pi-tui = { version = "=0.1.0", path = "../pi-tui" }
ratatui = { version = "=0.30.2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.52.4", default-features = false, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }
[dev-dependencies]
tempfile = "=3.27.0"
