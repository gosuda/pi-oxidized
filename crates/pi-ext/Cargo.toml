[package]
name = "pi-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
## Test-only timing seam for the extension RPC dispatch bench lane.
## Zero overhead in production; enables per-request Instant capture
## at the decode and encode seams in `serve_io`.
bench-seam = []

[dependencies]
anstyle-parse = "=1.0.0"
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
futures = { version = "=0.3.34", default-features = false, features = ["alloc"] }
pi-agent = { version = "=0.1.0", path = "../pi-agent" }
pi-ai = { version = "=0.1.0", path = "../pi-ai" }
pi-tui = { version = "=0.1.0", path = "../pi-tui" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["poll"] }

[dev-dependencies]
tempfile = "=3.27.0"
