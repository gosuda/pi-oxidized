[package]
name = "pi-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "=0.22.1"
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "event-stream", "events"] }
futures = { version = "=0.3.32", default-features = false, features = ["alloc", "async-await"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "scrolling-regions", "underline-color"] }
thiserror = "=2.0.18"
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.52.4", default-features = false, features = ["macros", "rt", "sync", "time"] }
unicode-segmentation = "=1.13.3"
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }
unicode-width = "=0.2.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["poll", "process", "signal"] }

[dev-dependencies]
avt = "=0.18.0"
insta = "=1.48.0"
portable-pty = "=0.9.0"
proptest = "=1.11.0"
serde_json = "=1.0.150"
tempfile = "=3.27.0"

[[bin]]
name = "pi_tui_pty_fixture"
path = "src/bin/pi_tui_pty_fixture.rs"
