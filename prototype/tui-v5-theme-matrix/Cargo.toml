# TUI-V5 theme and contrast matrix prototype (issue #79).
# Standalone — the empty [workspace] table keeps this crate out of the repo
# workspace so the shipped crate graph and deny.toml surface are untouched.
# Not published, not wired into CI.
[workspace]

[package]
name = "tui-v5-theme-matrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[dependencies]
sonic-rs = "=0.5.8"
