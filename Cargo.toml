[workspace]
resolver = "3"
members = [
    "crates/pi",
    "crates/pi-agent",
    "crates/pi-ai",
    "crates/pi-ext",
    "crates/pi-tui",
]
exclude = [".agent-tasks/pi-rust-rewrite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
