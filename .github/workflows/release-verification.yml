name: Release Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SOURCE_DATE_EPOCH: "1735689600"

jobs:
  release-verification:
    name: Build & Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up QEMU for aarch64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        id: qemu
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
        with:
          platforms: arm64

      - name: Install cross-compiler for aarch64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Verify aarch64 smoke execution support
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          QEMU_PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: |
          case ",${QEMU_PLATFORMS}," in
            *,linux/arm64,*) ;;
            *) echo "setup-qemu did not register linux/arm64: ${QEMU_PLATFORMS}" >&2; exit 1 ;;
          esac
          test -r /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: JS checks and scripts tests
        run: |
          bun run check
          bun test scripts

      - name: Build and Package (First Pass)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: bun run scripts/package-release.ts --target ${{ matrix.target }} --out dist/pass1

      - name: Build and Package (Second Pass)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: bun run scripts/package-release.ts --target ${{ matrix.target }} --out dist/pass2

      - name: Verify Determinism
        shell: bash
        run: diff -u dist/pass1/*.sha256 dist/pass2/*.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pi-${{ matrix.target }}
          path: dist/pass1/*
