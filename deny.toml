[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
    # syntect 5.3.0 (pinned in crates/pi/Cargo.toml) transitively pulls these
    # in for its compile-time syntax-set serialization path. No qualified
    # released syntect version removes either transitive: upstream's
    # yaml-rust2 migration is unreleased and the bincode replacement PR is
    # unreviewed/unreleased. Inputs are compile-time-vendored syntax YAML
    # and syntect-owned freshly generated lazy-context bytes, so neither
    # unmaintained crate processes untrusted input here. Remove both
    # entries on the first qualified syntect release that eliminates the
    # transitive; `unused-ignored-advisory = "deny"` above fails the check
    # if an entry is left in place after the advisory is gone.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 via syntect 5.3.0; no safe upgrade, transitive only; remove on first syntect release dropping bincode" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust 0.4.5 via syntect 5.3.0; no safe upgrade, transitive only; remove on first syntect release switching to yaml-rust2" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
